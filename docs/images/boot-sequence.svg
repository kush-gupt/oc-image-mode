<line class="lifeline" data-actor="SMD" x1="810.5060000000001" y1="70" x2="810.5060000000001" y2="450" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Node" data-to="DHCP" data-label="PXE boot request" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="88.8415" y1="90" x2="237.262" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="163.05175" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PXE boot request</text>
</g>
