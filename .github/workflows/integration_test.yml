name: Integration tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Build CentOS Stream 10 bootc image for OpenCHAMI"]
    types: [completed]

jobs:
  inspect-image:
    name: "Tier 1: Image inspection"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      packages: read

    env:
      IMAGE: "ghcr.io/${{ github.repository }}:latest"

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Install podman and buildah
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman buildah

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: >-
          podman login
          -u "${{ github.actor }}"
          -p "${{ secrets.GITHUB_TOKEN }}"
          ghcr.io

      - name: Pull the image
        if: github.event_name != 'pull_request'
        run: podman pull "${IMAGE,,}"

      - name: Build the image locally (PR)
        if: github.event_name == 'pull_request'
        run: buildah bud -t "${IMAGE,,}" -f Containerfile .

      - name: Run image inspection
        run: sudo bash tests/inspect-image.sh "${IMAGE,,}"

  smoke-openchami:
    name: "Tier 2: OpenCHAMI smoke test"
    runs-on: ubuntu-latest
    needs: inspect-image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      COMPOSE_FILE: "base.yml:postgres.yml:jwt-security.yml:openchami-svcs.yml"

    steps:
      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Clone OpenCHAMI deployment-recipes
        uses: actions/checkout@v4
        with:
          repository: OpenCHAMI/deployment-recipes
          path: deployment-recipes

      - name: Use latest OpenCHAMI service images
        working-directory: deployment-recipes/quickstart
        run: |
          for svc in smd bss cloud-init; do
            sed -i "s|ghcr.io/openchami/${svc}:[^ ]*|ghcr.io/openchami/${svc}:latest|g" \
              openchami-svcs.yml
          done

      - name: Generate OpenCHAMI configs
        working-directory: deployment-recipes/quickstart
        run: |
          LOCAL_IP="127.0.0.1"
          SYSTEM_NAME="ci-test"
          SYSTEM_DOMAIN="openchami.cluster"

          cat > .env <<-EOF
          LOCAL_IP=$LOCAL_IP
          SYSTEM_NAME=$SYSTEM_NAME
          SYSTEM_DOMAIN=$SYSTEM_DOMAIN
          POSTGRES_USER=ochami
          POSTGRES_PASSWORD=ci-test-pg-pass
          SMD_POSTGRES_PASSWORD=ci-test-smd-pass
          BSS_POSTGRES_PASSWORD=ci-test-bss-pass
          HYDRA_POSTGRES_PASSWORD=ci-test-hydra-pass
          HYDRA_SYSTEM_SECRET=ci-test-hydra-secret-that-is-long-enough
          EOF

          mkdir -p configs
          cat > configs/opaal.yaml << 'OPAAL'
          version: "0.0.1"
          server:
            host: "opaal"
            port: 3333
            callback: "/oidc/callback"
            issuer:
              host: "opaal-idp"
              port: 3332
              clients:
                - id: openchami
                  secret: ci-test-opaal-secret
                  name: openchami
                  redirect-uris:
                    - "http://opaal:3333/oidc/callback"
          authentication:
            state: ""
            test-all: false
            clients:
              - id: openchami
                secret: ci-test-opaal-secret
                name: openchami
                provider:
                  issuer: "http://opaal-idp:3332"
                redirect-uris:
                  - "http://opaal:3333/oidc/callback"
          authorization:
            key-path: ./keys
            token:
              forwarding: false
              refresh: false
              duration: 16h
            endpoints:
              issuer: http://hydra:4444
              config: http://hydra:4444/.well-known/openid-configuration
              jwks: http://hydra:4444/.well-known/jwks.json
              trusted-issuers: http://hydra:4445/admin/trust/grants/jwt-bearer/issuers
              login: http://hydra:4433/self-service/login/api
              clients: http://hydra:4445/admin/clients
              authorize: http://hydra:4444/oauth2/auth
              token: http://hydra:4444/oauth2/token
          options:
            run-once: true
            open-browser: false
            flow: authorization_code
            cache-only: false
            verbose: true
          OPAAL

          cat > configs/hydra.yml << 'HYDRA'
          serve:
            cookies:
              same_site_mode: Lax
            public:
              cors:
                enabled: true
          urls:
            self:
              issuer: http://hydra:4444
            consent: http://opaal-idp:3332/consent
            login: http://opaal-idp:3332/login
            logout: http://opaal-idp:3332/logout
          HYDRA

      - name: Start OpenCHAMI services
        working-directory: deployment-recipes/quickstart
        run: docker compose up -d

      - name: Wait for services to become healthy
        working-directory: deployment-recipes/quickstart
        run: |
          echo "Waiting for OpenCHAMI services..."
          for i in $(seq 1 60); do
            SMD_OK=$(curl -sf http://localhost:27779/hsm/v2/service/ready 2>/dev/null && echo yes || echo no)
            CI_OK=$(curl -sf http://localhost:27777/cloud-init/version 2>/dev/null && echo yes || echo no)
            if [[ "$SMD_OK" == "yes" && "$CI_OK" == "yes" ]]; then
              echo "All services healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:27779/hsm/v2/service/ready
          curl -sf http://localhost:27777/cloud-init/version

      - name: Run smoke tests
        run: bash tests/smoke-openchami.sh http://localhost

      - name: Dump logs on failure
        if: failure()
        working-directory: deployment-recipes/quickstart
        run: docker compose logs --tail=50

      - name: Tear down services
        if: always()
        working-directory: deployment-recipes/quickstart
        run: docker compose down --volumes
