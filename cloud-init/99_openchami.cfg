# OpenCHAMI cloud-init datasource configuration.
#
# The NoCloud datasource is used with OpenCHAMI's cloud-init server via
# the nocloud-net variant. The seedfrom URL is supplied at boot time through
# kernel parameters (ds=nocloud-net;s=http://<ochami-server>/cloud-init),
# so it is intentionally omitted here.
datasource_list: [NoCloud, None]
datasource:
  NoCloud: {}
